name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup CocoaPods
        run: |
          sudo gem install cocoapods

      - name: Setup Web Directory & Capacitor Config
        run: |
          mkdir -p www
          find . -maxdepth 1 ! -name 'www' ! -name '.git' ! -name '.github' ! -name 'node_modules' -exec cp -r {} www/ \;
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mapisula.stockmarket",
            "appName": "Stock Market Game",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add and Sync iOS Platform
        run: |
          npx cap add ios
          cd ios/App && pod install && cd ../..
          npx cap sync ios

      - name: Build Xcode Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r StockMarketGame.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockMarketGame-IPA
          path: StockMarketGame.ipa
