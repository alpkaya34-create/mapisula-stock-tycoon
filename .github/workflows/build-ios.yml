name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        env:
          CI: true
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install -g @capacitor/assets

      - name: Prepare Web Directory & Assets
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp style.css www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          cp icon.png www/ 2>/dev/null || true
          cp -r assets www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true
          
          # Otomatik ikon üretimi için assets klasörünü yapılandır
          mkdir -p assets
          cp icon.png assets/icon.png 2>/dev/null || true
          cp icon.png assets/icon-only.png 2>/dev/null || true
          cp icon.png assets/icon-foreground.png 2>/dev/null || true

      - name: Generate Clean iOS Project & Icons
        env:
          CI: true
        run: |
          rm -rf ios
          npx cap add ios
          npx @capacitor/assets generate --ios || true
          npx cap sync ios

      - name: Build Xcode Archive (SPM)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r StockMarketGame.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockMarketGame-IPA
          path: StockMarketGame.ipa
