name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        env:
          CI: true
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install -g @capacitor/assets @capacitor/cli @capacitor/android

      - name: Prepare Web Directory & Assets
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp style.css www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          cp icon.png www/ 2>/dev/null || true
          cp -r assets www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true
          
          # Android ikon oluşturma aracı için assets klasörü hazırla
          mkdir -p assets
          cp icon.png assets/icon.png 2>/dev/null || true
          cp icon.png assets/icon-only.png 2>/dev/null || true
          cp icon.png assets/icon-foreground.png 2>/dev/null || true

      - name: Generate Clean Android Project & Icons
        env:
          CI: true
        run: |
          rm -rf android
          npx cap add android
          npx @capacitor/assets generate --android || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockMarketGame-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
